name: Deploy to EC2
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: doorstep-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: doorstep_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d doorstep_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/doorstep_test
      APP_URL: http://127.0.0.1:4317
      DEMO_MODE: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare test environment
        run: touch .env
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      packages: write
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      PRODUCTION_BASE_URL: https://porchpong.com
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish versioned ARM64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: APP_BUILD=${{ github.sha }}
          cache-from: type=gha,scope=doorstep-arm64
          cache-to: type=gha,mode=max,scope=doorstep-arm64
      - name: Prepare SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in EC2_HOST EC2_USER EC2_SSH_KEY EC2_KNOWN_HOSTS; do
            test -n "${!name}" || { echo "Missing $name"; exit 1; }
          done
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$EC2_SSH_KEY" > "$HOME/.ssh/doorstep"
          printf '%s\n' "$EC2_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/doorstep" "$HOME/.ssh/known_hosts"
      - name: Transfer deployment script and temporary registry login
        run: |
          set -euo pipefail
          remote="$EC2_USER@$EC2_HOST"
          ssh -i "$HOME/.ssh/doorstep" -o StrictHostKeyChecking=yes "$remote" 'install -d -m 700 "$HOME/doorstep/.docker"'
          scp -i "$HOME/.ssh/doorstep" -o StrictHostKeyChecking=yes scripts/deploy-ec2.sh "$remote:doorstep/deploy-ec2.sh"
          scp -i "$HOME/.ssh/doorstep" -o StrictHostKeyChecking=yes "$HOME/.docker/config.json" "$remote:doorstep/.docker/config.json"
          ssh -i "$HOME/.ssh/doorstep" -o StrictHostKeyChecking=yes "$remote" 'chmod 600 "$HOME/doorstep/.docker/config.json"'
      - name: Migrate and deploy through consolidated Compose
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/doorstep" -o StrictHostKeyChecking=yes "$EC2_USER@$EC2_HOST" \
            "bash doorstep/deploy-ec2.sh '$GITHUB_SHA' 'ghcr.io/$GITHUB_REPOSITORY:$GITHUB_SHA'"
      - name: Verify public release
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 5 \
            "$PRODUCTION_BASE_URL/api/health" > "$RUNNER_TEMP/doorstep-health.json"
          node -e 'const h=JSON.parse(require("fs").readFileSync(process.argv[1])); if(h.status!=="ok"||h.database!=="ready"||h.build!==process.env.GITHUB_SHA) process.exit(1); console.log("Public PorchPong release verified:",h.build)' "$RUNNER_TEMP/doorstep-health.json"
          curl --fail --silent --show-error "$PRODUCTION_BASE_URL/" -o "$RUNNER_TEMP/doorstep-home.html"
          grep -q 'PorchPong' "$RUNNER_TEMP/doorstep-home.html"
      - name: Remove temporary registry login
        if: always()
        run: |
          if [ -f "$HOME/.ssh/doorstep" ]; then
            ssh -i "$HOME/.ssh/doorstep" -o StrictHostKeyChecking=yes "$EC2_USER@$EC2_HOST" 'rm -f "$HOME/doorstep/.docker/config.json"' || true
          fi
